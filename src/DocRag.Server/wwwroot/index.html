<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>docRAG</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>docRAG</h1>
      <p class="subtitle">Frage stellen &mdash; Antworten kommen mit Quellenangaben aus den lokalen Dokumenten</p>
    </header>

    <main>
      <form id="chat-form">
        <textarea id="question" placeholder="Deine Frage..." rows="3" required></textarea>
        <button type="submit" id="ask-button">Fragen</button>
      </form>

      <div id="result" class="hidden">
        <section class="answer">
          <h2>Antwort</h2>
          <p id="answer-text"></p>
        </section>

        <section class="sources">
          <h2>Quellen</h2>
          <div id="sources-list"></div>
        </section>
      </div>

      <div id="error" class="hidden error"></div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
